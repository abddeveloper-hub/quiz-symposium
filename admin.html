<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1; url=http://localhost:3000/admin">
  <title>Admin Conductor Deck • Academic Symposium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #e8fef8;
      color: #0c1f1b;
      font-family: 'Manrope', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      background-image: 
        linear-gradient(to right, rgba(11, 166, 137, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(11, 166, 137, 0.05) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dbe6e3;
      border-radius: 0.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 12px 36px -6px rgba(11, 166, 137, 0.08), 0 4px 12px -2px rgba(11, 166, 137, 0.04);
    }
    .badge {
      display: inline-block;
      background: #edf4f2;
      border: 1px solid #dbe6e3;
      color: #0ba689;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 0.25rem;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
      font-weight: 600;
      font-family: 'Noto Serif', Georgia, serif;
      color: #1e332f;
      letter-spacing: -0.015em;
    }
    p {
      color: #49625d;
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0 0 1.75rem;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      background: #0ba689;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.25rem;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.88rem;
      box-shadow: 0 4px 14px rgba(11, 166, 137, 0.2);
      transition: all 0.15s ease-in-out;
    }
    .btn-secondary {
      background: #ffffff;
      border: 1.5px solid #0ba689;
      color: #0ba689;
      box-shadow: none;
    }
    .btn:hover {
      background: #088f75;
      box-shadow: 0 6px 20px rgba(11, 166, 137, 0.3);
      transform: translateY(-1px);
    }
    .btn-secondary:hover {
      background: #f6faf9;
      color: #088f75;
      border-color: #088f75;
    }
  </style>
  <script>
    window.location.replace("http://localhost:3000/admin");
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">Luminous Emerald Academic</div>
    <h1>Admin Conductor Room</h1>
    <p>Opening the live examination conductor console at <strong>http://localhost:3000/admin</strong>...</p>
    <div class="btn-group">
      <a href="http://localhost:3000/admin" class="btn">Enter Conductor Room &rarr;</a>
      <a href="http://localhost:3000/" class="btn btn-secondary">Candidate View &rarr;</a>
    </div>
  </div>
</body>
</html>
